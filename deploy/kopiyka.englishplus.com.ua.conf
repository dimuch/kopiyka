# /etc/nginx/sites-available/kopiyka.englishplus.com.ua.conf
# Serves the kopiyka web app (static Expo export of the live release) and
# proxies /api to the API on 127.0.0.1:3100, on one HTTPS origin: the session
# cookie is Secure, SameSite=Strict and scoped to /api. The cert is issued
# first with `certbot certonly --nginx` (deploy/README.md), so this file owns
# its TLS block, like gendash.conf.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kopiyka.englishplus.com.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kopiyka.englishplus.com.ua;

    ssl_certificate     /etc/letsencrypt/live/kopiyka.englishplus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kopiyka.englishplus.com.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/kopiyka/current/apps/mobile/dist;

    # No URI part in proxy_pass, so /api/... reaches the API unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        # The API trusts X-Forwarded-For from loopback only and the login
        # throttle counts its last entry, so nginx must append the client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths get index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
