# /etc/nginx/sites-available/kopiyka.englishplus.com.ua.conf
# Serves the kopiyka web app (static Expo export of the live release) and
# proxies /api to the API on 127.0.0.1:3100, on one HTTPS origin: the session
# cookie is Secure, SameSite=Strict and scoped to /api. It also proxies the MCP
# connector's /mcp, /oauth/ and /.well-known/oauth-* to 127.0.0.1:3200. The cert is issued
# first with `certbot certonly --nginx` (deploy/README.md), so this file owns
# its TLS block, like gendash.conf.
#
# It also serves the demo (briefs 080, 081) on demo.kopiyka.englishplus.com.ua: the demo
# build's static files from the same release, with its own certificate. It proxies nothing:
# the demo answers from memory in the browser, and its CSP refuses any network call.

# Cache-Control per path. A location with an add_header of its own would drop the server-level security headers
# below, so caching is set here instead and no location adds headers. An empty value sends no header.
map $uri $kopiyka_cache_control {
    default "";
    # The app's entry page, also reached by try_files from `/` and every app path. Browsers must check it on each
    # load, or they keep running the previous release's bundle after a deploy.
    /index.html "no-cache";
    # Expo writes the bundle under a content-hashed name, so a file here never changes.
    ~^/_expo/static/ "public, max-age=31536000, immutable";
}

# The address every limit below counts by (brief 072): an IPv4 address whole, an IPv6 one by its /64, since one client
# holds a whole /64 and could otherwise step around each limit. It works on the 4- or 16-byte $binary_remote_addr, not
# $remote_addr's text, which IPv6 can write several ways. (?s) lets . match any byte. The API's login throttle groups
# IPv6 the same way (apps/api/src/auth/ipKey.ts). The zones keyed on it got new names (_64): a reload refuses a changed
# key on a live zone, `nginx -t` doesn't see that, and the old config would stay on.
map $binary_remote_addr $kopiyka_addr {
    "~(?s)^(.{8}).{8}$" $1;
    default $binary_remote_addr;
}

# The MCP connector's limits (brief 063). This is the shared http context, hence the kopiyka_ prefix on every name.
# POSTs to /oauth/ share the tight zone; the empty key of any other method isn't counted. The app's login reuses this
# key below. Don't rename it: a reload refuses a changed key on a live zone, `nginx -t` doesn't see that, and the old
# config stays on.
map $request_method $kopiyka_oauth_post_key {
    POST $kopiyka_addr;
    default "";
}
limit_req_zone $kopiyka_addr zone=kopiyka_mcp_64:10m rate=120r/m;
limit_req_zone $kopiyka_addr zone=kopiyka_oauth_64:10m rate=60r/m;
limit_req_zone $kopiyka_oauth_post_key zone=kopiyka_oauth_post:10m rate=10r/m;
limit_conn_zone $kopiyka_addr zone=kopiyka_mcp_conn_64:10m;
# No query: on /oauth/authorize it holds the client's state and redirect URI.
log_format kopiyka_no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# The app's API limits (brief 067). The login key is empty, so not counted, on everything but POST /api/auth/login.
map $uri $kopiyka_login_key {
    default "";
    /api/auth/login $kopiyka_oauth_post_key;
}
limit_req_zone $kopiyka_addr zone=kopiyka_api_64:10m rate=300r/m;
limit_req_zone $kopiyka_login_key zone=kopiyka_login:10m rate=20r/m;
limit_conn_zone $kopiyka_addr zone=kopiyka_api_conn_64:10m;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kopiyka.englishplus.com.ua demo.kopiyka.englishplus.com.ua;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kopiyka.englishplus.com.ua;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kopiyka.englishplus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kopiyka.englishplus.com.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/kopiyka/current/apps/mobile/dist;

    # Security headers on every answer, errors and /api included (`always`). HSTS is a year, raised from one day after
    # production ran a day on these headers. No includeSubDomains: other englishplus.com.ua sites aren't ours to pin.
    # The CSP allows inline styles only: react-native-web and expo-font insert <style> elements at runtime.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Not `always`: a missing bundle file's 404 must not be cached as immutable.
    add_header Cache-Control $kopiyka_cache_control;

    # No URI part in proxy_pass, so /api/... reaches the API unchanged.
    location /api/ {
        limit_req zone=kopiyka_api_64 burst=100 nodelay;
        limit_req zone=kopiyka_login burst=10 nodelay;
        limit_conn kopiyka_api_conn_64 30;
        # Here, not in the server block, so the connector's 429s stay as they are. It only sees nginx's own refusals:
        # the API's 429 `blocked` passes through, because nginx doesn't intercept proxied errors by default.
        error_page 429 /kopiyka-rate-limited;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        # The API trusts X-Forwarded-For from loopback only and the login
        # throttle counts its last entry, so nginx must append the client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The JSON the app reads a limit from. default_type, because an add_header here would drop the security headers.
    location = /kopiyka-rate-limited {
        internal;
        default_type application/json;
        return 429 '{"error":"rate_limited"}';
    }

    # The MCP connector (brief 063), on 127.0.0.1:3200. Over a limit is a plain refusal, never a held connection. The
    # same proxy settings repeat below because a location inherits none from its siblings, and no location here may
    # set add_header, or it loses the security headers above. /api/ needs these two as well: without them a refusal is
    # a 503, which misses its error_page.
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 10s;

    # Only Anthropic's outbound ranges, the same list as /oauth/(token|register) below (brief 072): a sealed token
    # copied out of Claude can't be used from anywhere else. limit_req runs before allow/deny, so a flood still gets 429
    # and anything else from outside gets 403, which never reaches the connector. Keep both lists the same.
    location = /mcp {
        allow 160.79.104.0/21;
        allow 153.61.208.0/20;
        deny all;
        limit_req zone=kopiyka_mcp_64 burst=60 nodelay;
        limit_conn kopiyka_mcp_conn_64 10;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Only Anthropic's outbound ranges, from platform.claude.com/docs/en/api/ip-addresses, as for /mcp above: a sign-in
    # code can't be redeemed from outside Anthropic's network. Connectors are IPv4-only. limit_req runs before
    # allow/deny, so a flood gets 429 and anything else from outside gets 403. This regex location beats /oauth/.
    location ~ ^/oauth/(token|register)$ {
        allow 160.79.104.0/21;
        allow 153.61.208.0/20;
        deny all;
        limit_req zone=kopiyka_oauth_64 burst=20 nodelay;
        limit_req zone=kopiyka_oauth_post burst=5 nodelay;
        access_log /var/log/nginx/access.log kopiyka_no_query;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The sign-in and consent pages: the user's own browser comes here, so no address limit.
    location /oauth/ {
        limit_req zone=kopiyka_oauth_64 burst=20 nodelay;
        limit_req zone=kopiyka_oauth_post burst=5 nodelay;
        access_log /var/log/nginx/access.log kopiyka_no_query;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/oauth- {
        limit_req zone=kopiyka_oauth_64 burst=20 nodelay;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Source maps are made only for the deploy's build check (brief 081) and deleted before the switch; never serve one.
    # A regex location, so it beats the /_expo/static/ prefix. No API, connector or app path ends in .map.
    location ~ \.map$ {
        return 404;
    }

    # A missing bundle file stays a 404 instead of falling back to index.html.
    location /_expo/static/ {
    }

    # Single-page app: unknown paths get index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The demo (briefs 080, 081): static files only, no proxies, no limits. /api, /mcp and /oauth get the demo's own page,
# whose router lands on Home.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.kopiyka.englishplus.com.ua;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/demo.kopiyka.englishplus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.kopiyka.englishplus.com.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/kopiyka/current/apps/mobile/dist-demo;

    # Production's headers, except `connect-src 'none'`: the demo makes no network call, so the browser refuses any.
    # Production's HSTS leaves out includeSubDomains, so this name sends its own, also without it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Not `always`: a missing bundle file's 404 must not be cached as immutable.
    add_header Cache-Control $kopiyka_cache_control;

    location ~ \.map$ {
        return 404;
    }

    # A missing bundle file stays a 404 instead of falling back to index.html.
    location /_expo/static/ {
    }

    # Single-page app: unknown paths get index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
