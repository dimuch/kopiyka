# Local dev database. Production runs MySQL 8.0.46 directly on the droplet.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kopiyka
      MYSQL_USER: kopiyka
      MYSQL_PASSWORD: kopiyka
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      # creates kopiyka_test for the integration tests
      - ./apps/api/test/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  mysql-data:
