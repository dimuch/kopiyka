# /etc/nginx/sites-available/kopiyka.englishplus.com.ua.conf
# Serves the kopiyka web app (static Expo export of the live release) and
# proxies /api to the API on 127.0.0.1:3100, on one HTTPS origin: the session
# cookie is Secure, SameSite=Strict and scoped to /api. It also proxies the MCP
# connector's /mcp, /oauth/ and /.well-known/oauth-* to 127.0.0.1:3200. The cert is issued
# first with `certbot certonly --nginx` (deploy/README.md), so this file owns
# its TLS block, like gendash.conf.

# Cache-Control per path. A location with an add_header of its own would drop the server-level security headers
# below, so caching is set here instead and no location adds headers. An empty value sends no header.
map $uri $kopiyka_cache_control {
    default "";
    # The app's entry page, also reached by try_files from `/` and every app path. Browsers must check it on each
    # load, or they keep running the previous release's bundle after a deploy.
    /index.html "no-cache";
    # Expo writes the bundle under a content-hashed name, so a file here never changes.
    ~^/_expo/static/ "public, max-age=31536000, immutable";
}

# The MCP connector's limits (brief 063). This is the shared http context, hence the kopiyka_ prefix on every name.
# POSTs to /oauth/ share the tight zone; the empty key of any other method isn't counted.
map $request_method $kopiyka_oauth_post_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=kopiyka_mcp:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=kopiyka_oauth:10m rate=60r/m;
limit_req_zone $kopiyka_oauth_post_key zone=kopiyka_oauth_post:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=kopiyka_mcp_conn:10m;
# No query: on /oauth/authorize it holds the client's state and redirect URI.
log_format kopiyka_no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kopiyka.englishplus.com.ua;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kopiyka.englishplus.com.ua;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/kopiyka.englishplus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kopiyka.englishplus.com.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/kopiyka/current/apps/mobile/dist;

    # Security headers on every answer, errors and /api included (`always`). HSTS is a year, raised from one day after
    # production ran a day on these headers. No includeSubDomains: other englishplus.com.ua sites aren't ours to pin.
    # The CSP allows inline styles only: react-native-web and expo-font insert <style> elements at runtime.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Not `always`: a missing bundle file's 404 must not be cached as immutable.
    add_header Cache-Control $kopiyka_cache_control;

    # No URI part in proxy_pass, so /api/... reaches the API unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        # The API trusts X-Forwarded-For from loopback only and the login
        # throttle counts its last entry, so nginx must append the client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The MCP connector (brief 063), on 127.0.0.1:3200. Over a limit is a plain refusal, never a held connection. The
    # same proxy settings repeat below because a location inherits none from its siblings, and no location here may
    # set add_header, or it loses the security headers above.
    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 10s;

    location = /mcp {
        limit_req zone=kopiyka_mcp burst=60 nodelay;
        limit_conn kopiyka_mcp_conn 10;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Only Anthropic's outbound ranges, from platform.claude.com/docs/en/api/ip-addresses: a sign-in code can't be
    # redeemed from outside Anthropic's network. Connectors are IPv4-only. limit_req runs before
    # allow/deny, so a flood gets 429 and anything else from outside gets 403. This regex location beats /oauth/.
    location ~ ^/oauth/(token|register)$ {
        allow 160.79.104.0/21;
        allow 153.61.208.0/20;
        deny all;
        limit_req zone=kopiyka_oauth burst=20 nodelay;
        limit_req zone=kopiyka_oauth_post burst=5 nodelay;
        access_log /var/log/nginx/access.log kopiyka_no_query;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The sign-in and consent pages: the user's own browser comes here, so no address limit.
    location /oauth/ {
        limit_req zone=kopiyka_oauth burst=20 nodelay;
        limit_req zone=kopiyka_oauth_post burst=5 nodelay;
        access_log /var/log/nginx/access.log kopiyka_no_query;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/oauth- {
        limit_req zone=kopiyka_oauth burst=20 nodelay;
        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 30s;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # A missing bundle file stays a 404 instead of falling back to index.html.
    location /_expo/static/ {
    }

    # Single-page app: unknown paths get index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
